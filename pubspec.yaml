name: academic_platform
description: منصة أكاديمية رقمية لإدارة ومتابعة العملية التعليمية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true


# إعداد إنشاء أيقونة التطبيق لأجهزة Android
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#051749"
  adaptive_icon_foreground: "assets/app_icon.png"
