name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter source files found."

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name academic_platform .

      - name: Verify Android Gradle files
        run: |
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          echo "Android Gradle files found."

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: academic-platform-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
